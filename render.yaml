services:
  - type: web
    name: logwatch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_DB_PATH
        value: /tmp/logwatch.db
